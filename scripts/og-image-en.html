<!doctype html>
<!--
  Modelo da imagem de compartilhamento da versão em inglês (public/og-image-en.png, 1200 × 630 px).
  É a prévia que aparece quando o link do site é colado no LinkedIn, WhatsApp etc.

  Para gerar de novo depois de editar os textos (no Git Bash, a partir da raiz do projeto):

    "/c/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=3000 \
      --screenshot="$(cygpath -w "$PWD/public/og-image-en.png")" "file:///$(cygpath -m "$PWD")/scripts/og-image-en.html"

  Ou abra este arquivo no navegador e tire um print de 1200 × 630 px.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url(../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2) format('woff2');
        font-weight: 200 800;
      }

      @font-face {
        font-family: 'Mono';
        src: url(../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2) format('woff2');
        font-weight: 100 800;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0e0d0b;
        color: #ede8df;
        font-family: 'Bricolage', sans-serif;
        font-optical-sizing: auto;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        box-sizing: border-box;
        height: 100%;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        border-top: 6px solid #f2a541;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Mono', monospace;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: #8d867b;
      }

      .top b {
        color: #f2a541;
        font-weight: 500;
      }

      h1 {
        margin: auto 0 0;
        font-size: 112px;
        font-weight: 650;
        line-height: 0.92;
        letter-spacing: -0.05em;
      }

      h1 span {
        color: #f2a541;
      }

      p {
        max-width: 30ch;
        margin: 28px 0 0;
        font-size: 34px;
        line-height: 1.3;
        letter-spacing: -0.01em;
        color: #aaa398;
      }

      .bottom {
        display: flex;
        justify-content: space-between;
        margin-top: 44px;
        padding-top: 24px;
        border-top: 1px solid #3b362e;
        font-family: 'Mono', monospace;
        font-size: 21px;
        color: #8d867b;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="top">
        <span><b>●</b>&nbsp; São Paulo, Brazil</span>
        <svg viewBox="0 0 32 32" width="56" height="56">
          <rect width="32" height="32" rx="8" fill="#1c1915" />
          <path d="M21.66 10.34A8 8 0 1 0 24 16h-6.5" fill="none" stroke="#f2a541" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>Gustavo<br />Avelino Sanchez<span>.</span></h1>
      <p>Computer Science student and aspiring web developer.</p>
      <div class="bottom">
        <span>JavaScript · React · Node.js · Express · MongoDB</span>
        <span>github.com/gusanchez1</span>
      </div>
    </div>
  </body>
</html>
