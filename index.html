<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SEO: título e descrição que aparecem no Google e ao compartilhar o link -->
    <title>Gustavo Avelino Sanchez · Desenvolvedor web em formação</title>
    <meta
      name="description"
      content="Portfólio de Gustavo Avelino Sanchez, estudante de Ciência da Computação na FAM, em São Paulo. Projetos com JavaScript, React, Node.js e MongoDB. Disponível para estágio, trainee, vaga júnior e projetos freelance."
    />
    <meta name="author" content="Gustavo Avelino Sanchez" />
    <meta name="theme-color" content="#0e0d0b" />
    <meta name="color-scheme" content="dark" />

    <!-- Ícone da aba: SVG nos navegadores atuais; .ico para os demais e para quem pede /favicon.ico direto -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph: prévia do link no LinkedIn, WhatsApp etc.
         og:url, og:image, o link canônico e os links de idioma (hreflang) são acrescentados no build (vite.config.js) -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Gustavo Avelino Sanchez" />
    <meta property="og:title" content="Gustavo Avelino Sanchez · Desenvolvedor web em formação" />
    <meta
      property="og:description"
      content="Estudante de Ciência da Computação em São Paulo. Projetos com JavaScript, React, Node.js e MongoDB, incluindo um sistema de agendamento em uso real."
    />
    <meta property="profile:first_name" content="Gustavo" />
    <meta property="profile:last_name" content="Avelino Sanchez" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1.5rem; font-family: system-ui, sans-serif; color: #ede8df; background: #0e0d0b">
        Gustavo Avelino Sanchez — estudante de Ciência da Computação e desenvolvedor web em formação.
        Este site precisa de JavaScript para exibir o conteúdo.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
