# Publica o site no GitHub Pages a cada push na branch main (ou manualmente, pela aba Actions).
# Antes do primeiro uso: no repositório, Settings → Pages → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se outra começar, a que está em andamento termina primeiro
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Descobre o endereço do site: https://gusanchez1.github.io/<repositorio> ou o domínio próprio
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm test

      - run: npm run build
        env:
          # "/<repositorio>/" sem domínio próprio, "/" com domínio próprio
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
